<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --popup-mine-color: #22c55e;
      --popup-opp-color: #ef4444;
      --bg-gradient: linear-gradient(135deg, #09090b 0%, #18181b 100%);
    }

    body {
      width: 250px;
      margin: 0;
      padding: 14px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      color: #e4e4e7;
      background: var(--bg-gradient);
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }
    
    .title-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .title-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--popup-mine-color);
      box-shadow: 0 0 8px var(--popup-mine-color);
      transition: 0.3s;
    }
    
    .title.disabled .title-dot {
      background: #71717a;
      box-shadow: none;
    }

    /* Status Badge */
    .status-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 14px;
    }
    
    .status-label {
      color: #a1a1aa;
      font-size: 11px;
    }
    
    .status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    
    .status-badge.active {
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
    }
    
    .status-badge.inactive {
      background: rgba(161, 161, 170, 0.1);
      color: #a1a1aa;
    }
    
    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: currentColor;
    }
    
    .status-badge.active .status-dot {
      animation: pulse 1.8s infinite ease-in-out;
    }
    
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.25); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }

    /* Settings Sections */
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 12px;
      margin-bottom: 6px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }
    
    .row-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      transition: background-color 0.2s;
    }
    .swatch-green { background: var(--popup-mine-color); }
    .swatch-red   { background: var(--popup-opp-color); }

    /* Custom Toggles/Switches */
    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #27272a;
      transition: 0.2s;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 2px;
      bottom: 2px;
      background-color: #a1a1aa;
      transition: 0.2s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: var(--popup-mine-color);
    }
    
    input:checked + .slider:before {
      transform: translateX(14px);
      background-color: #ffffff;
    }

    /* Dropdowns/Selects */
    select {
      background: #18181b;
      color: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      transition: 0.2s;
    }
    
    select:focus {
      border-color: var(--popup-mine-color);
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.15);
    }

    /* Custom Color Pickers Box */
    .color-pickers-container {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.08);
      border-radius: 6px;
    }
    
    .color-picker-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      font-size: 10px;
      color: #71717a;
      font-weight: 500;
    }
    
    .color-picker-wrapper input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 100%;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      background: none;
      padding: 0;
    }
    
    .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    
    .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    /* Opacity Slider styling */
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 8px;
    }
    
    .slider-header {
      display: flex;
      justify-content: space-between;
      color: #a1a1aa;
      font-size: 11px;
    }
    
    .slider-row input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #27272a;
      outline: none;
      margin: 8px 0;
      cursor: pointer;
    }
    
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--popup-mine-color);
      cursor: pointer;
      transition: 0.1s;
    }
    
    .slider-row input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .divider {
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin: 8px 0;
    }

    .footer {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 10px;
      color: #71717a;
      text-align: center;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="title" id="panel-title">
    <div class="title-left">
      <div class="title-dot"></div>
      <span>Chess Vision</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="status-container">
    <span class="status-label">Active Board</span>
    <span id="board-status" class="status-badge inactive">
      <span class="status-dot"></span>
      <span id="status-text">Detecting...</span>
    </span>
  </div>

  <div class="section-title">Display Options</div>
  
  <div class="row">
    <span class="status-label">Display Mode</span>
    <div style="width: 120px;">
      <select id="viewMode">
        <option value="lines">Lines of Sight</option>
        <option value="squares">Square Highlight</option>
        <option value="both">Both</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="row-label">
      <span class="swatch swatch-green" id="swatch-mine"></span>
      <span>Your control</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="showMine">
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <div class="row-label">
      <span class="swatch swatch-red" id="swatch-opp"></span>
      <span>Opponent control</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="showOpp">
      <span class="slider"></span>
    </label>
  </div>

  <div class="divider"></div>

  <div class="section-title">Color Theme</div>
  <div class="row" style="padding-bottom: 2px;">
    <select id="theme">
      <option value="classic">Classic (Green & Red)</option>
      <option value="colorblind">Colorblind (Blue & Orange)</option>
      <option value="cyberpunk">Cyberpunk (Cyan & Pink)</option>
      <option value="custom">Custom Colors...</option>
    </select>
  </div>

  <div class="color-pickers-container" id="custom-colors-box" style="display: none;">
    <div class="color-picker-wrapper">
      <span>Mine</span>
      <input type="color" id="mineColor" value="#22c55e">
    </div>
    <div class="color-picker-wrapper">
      <span>Opponent</span>
      <input type="color" id="oppColor" value="#ef4444">
    </div>
  </div>

  <div class="divider"></div>

  <div class="row">
    <span>Hover Focus Mode</span>
    <label class="switch">
      <input type="checkbox" id="hoverMode">
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <span>Quick-Toggle Hotkey [V]</span>
    <label class="switch">
      <input type="checkbox" id="hotkeyEnabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="slider-row">
    <div class="slider-header">
      <span>Line / Fill Opacity</span>
      <span id="opacity-val">30%</span>
    </div>
    <input type="range" id="opacity" min="10" max="90" step="5">
  </div>

  <div class="footer">
    Settings apply instantly to active tabs.<br>
    Press V on a chess board to quickly toggle.
  </div>
  <script src="popup.js"></script>
</body>
</html>
